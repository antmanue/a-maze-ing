[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0"
description = "Maze vizualizer and genarator"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []
authors = [{name = "pedrohe3"}, {name = "antmanue"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen"]